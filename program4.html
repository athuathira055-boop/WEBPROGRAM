<html>
<head>
<title>Registration Form</title>
</head>
<body bgcolor="lightyellow">
<center>
<h2><b><u>Registration Form</u></b></h2>
<br><br>
<form>
Name:
<input type="text" name="name" required>
<br><br>
Email:
<input type="email" name="email" required>
<br><br>
Password:
<input type="password" name="password" required>
<br><br>
Gender:
<input type="radio" name="gender" value="male" required> Male
<input type="radio" name="gender" value="female" required> Female
<input type="radio" name="gender" value="other" required> Other
<br><br>
Hobbies:
<input type="checkbox" name="hobbies" value="dance">Dance
<input type="checkbox" name="hobbies" value="drawing">Drawing
<input type="checkbox" name="hobbies" value="singing">Singing
<input type="checkbox" name="hobbies" value="other">Other<br><br>
Date of Birth:
<input type="date" name="dob" required>
<br><br>
Phone:
<input type="number" name="phone" required>
<br><br>
Address:
<textarea name="address" rows="4" cols="20" required></textarea>
<br><br>
Course:
<select name="course" required>
<option value="">--Select Course--</option>
<option value="BSc">BSc</option>
<option value="BCA">BCA</option>
<option value="BBA">BBA</option>
<option value="MSc">MSc</option>
<option value="MCA">MCA</option>
<option value="MBA">MBA</option>
</select>
<br><br>
<input type="submit" value="Submit">
<input type="reset" value="Reset">
</form>
</center>
</body>
</html>
