<!DOCTYPE html>
<html>
<head>
<title>Registration Form</title>
<style>
body {
    font-family: Arial;
    background-color: #E3F2FD;
}

.container {
    width: 350px;
    margin: 50px auto;
    padding: 20px;
    background: #FFFFFF;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
}

h2 {
    color: #1565C0;
    text-align: center;
}
input {
       width: 95%;
       padding: 8px;
       margin: 8px 0;
       border: 1px solid #90CAF9;
       border-radius: 5px;
}
button {
        width:100%;
        padding:10px;
        background:#1976D2;
        color:white;
        border:none;
        border-radius:5px;
        cursor:pointer;
}
button:hover {
              background: #0D47A1;
}
span {
      color:#E53935;
      font-size: 12px;
      display: block;
      margin-bottom: 5px;
}
</style>
</head>
<body>
<script>
function validateForm() {
let name=document.getElementById("name").value;
let email=document.getElementById("email").value;
let password=document.getElementById("password").value;
let confirm=document.getElementById("confirm").value;
let mobile=document.getElementById("mobile").value;
document.querySelectorAll("span").forEach(function(s) {
s.innerHTML= "";
});
if(name.trim()=="") {
document.getElementById("nameError").innerHTML = "Please enter your name";
return false;
}
let emailPattern= /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
if (!emailPattern.test(email)) {
document.getElementById("emailError").innerHTML="Enter a valid email address";
return false;
}
if (password.length < 6) {
document.getElementById("passwordError").innerHTML="Password must contain at least 6 characters";
return false;
}
if (password != confirm) {
document.getElementById("confirmError").innerHTML = "Passwords do not match";
return false;
}
let mobilePattern = /^[0-9]{10}$/;
if (!mobilePattern.test(mobile)) {
document.getElementById("mobileError").innerHTML = "Enter a valid 10-digit mobile number";
return false;
}
alert("Registration Successful!");
return true;
}
</script>
<div class="container">
<h2>Registration Form</h2>
<form onsubmit="return validateForm()">
<label>Name:</label>
<input type="text" id="name" placeholder="Enter your name">
<span id="nameError"></span>
<label>Email:</label>
<input type="text" id="email" placeholder="Enter your email">
<span id="emailError"></span>
<label>Password:</label>
<input type="password" id="password" placeholder="Enter password">
<span id="passwordError"></span>
<label>Confirm Password:</label>
<input type="password" id="confirm" placeholder="Confirm password">
<span id="confirmError"></span>
<label>Mobile Number:</label>
<input type="text" id="mobile" placeholder="Enter mobile number">
<span id="mobileError"></span>
<button type="submit">Register</button>
</form>
</div>
</body>
</html>
